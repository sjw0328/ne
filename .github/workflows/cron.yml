# 워커 cron 대신 밖에서 눌러 주는 트리거 (9/20)
#
# 왜 필요한가. 9/15 무렵부터 Cloudflare 가 scheduled 이벤트를 워커에 전달하지 않습니다.
# 트리거 표에는 그대로 있고 fetch 요청은 정상이라, 링크로 /admin/* 를 부르면 잘 됩니다.
# 저쪽이 고쳐질 때까지 이 워크플로가 같은 주소를 대신 누릅니다.
# 클라우드플레어가 되돌아오면 이 파일을 지우거나 schedule 두 줄을 주석 처리하면 됩니다
# (양쪽이 같이 돌아도 망가지지는 않습니다 — 수집은 같은 회차를 두 번 읽지 않고,
#  푸시는 내용이 같으면 changed:false 로 끝납니다).
#
# 올리는 자리:  server/gh-cron.yml  →  저장소 .github/workflows/cron.yml
# 넣어야 하는 Secret: ADMIN_TOKEN (Settings → Secrets → Actions). 주소창에 치던 %25 같은
# 인코딩 없는 원래 글자를 넣습니다 — curl 이 --data-urlencode 로 다시 씁니다. 워커 대시보드에
# 넣은 값과 같은 글자여야 합니다. GITHUB_TOKEN 은 여기서 안 씁니다 — 저장소에
# 쓰는 것은 워커이지 이 워크플로가 아닙니다.

name: atlas-cron

on:
  schedule:
    # 수집. GDELT 회차 파일이 15분마다 올라오므로 15분 간격입니다.
    # Actions 는 정시에 오지 않고 5~20분 늦을 때가 있어, 늦으면 그 회차는 건너뛰고
    # 다음 회차를 읽습니다 — 빠진 회차는 되돌아가 줍지 않습니다.
    - cron: '7,22,37,52 * * * *'
    # 스냅샷. 저장소 data/*.json 을 갱신합니다. 화면이 보는 것은 이 파일들입니다.
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      what:
        description: '손으로 한 번 (ingest / push / both)'
        default: both

concurrency:
  group: atlas-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://ntlgs-atlas.seodes105.workers.dev
      T: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: 무엇을 할 회차인가
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            '2 * * * *') echo "do=push"   >> $GITHUB_OUTPUT ;;
            '')          echo "do=${{ inputs.what || 'both' }}" >> $GITHUB_OUTPUT ;;
            *)           echo "do=ingest" >> $GITHUB_OUTPUT ;;
          esac

      - name: 토큰 확인
        run: |
          if [ -z "$T" ]; then
            echo "::error::ADMIN_TOKEN Secret 이 비어 있습니다. Settings → Secrets → Actions 에 넣으십시오."
            exit 1
          fi

      # 요청 경로는 CPU 10ms 라 한 번에 다 못 넣고 잘릴 수 있습니다. 잘려도 넣던 데까지는
      # 들어가므로, 30초 간격으로 세 번 눌러 남은 줄을 이어 넣습니다. 같은 회차를 이미
      # 다 읽었으면 워커가 skip 을 돌려주고 끝납니다 (GDELT 를 다시 받지 않습니다).
      - name: 수집
        if: steps.plan.outputs.do != 'push'
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -G -o body.json -w '%{http_code}' --max-time 60 --data-urlencode "t=$T" "$API/admin/ingest") || true
            echo "[$i] HTTP $code  $(head -c 400 body.json)"
            if [ "$code" = "401" ]; then
              echo "::error::401 — ADMIN_TOKEN 이 워커 값과 다릅니다."
              exit 1
            fi
            if [ $i -lt 3 ]; then sleep 30; fi
          done

      - name: 스냅샷 밀어넣기
        if: steps.plan.outputs.do != 'ingest'
        run: |
          code=$(curl -sS -G -o body.json -w '%{http_code}' --max-time 90 --data-urlencode "t=$T" "$API/admin/push") || true
          echo "HTTP $code  $(head -c 600 body.json)"
          case "$code" in
            401) echo "::error::401 — ADMIN_TOKEN";                                  exit 1 ;;
            404) echo "::error::404 — GH_TOKEN 권한이거나 저장소 이름";               exit 1 ;;
            200) : ;;
            *)   echo "::error::예상 밖 $code"; exit 1 ;;
          esac
          grep -q '"changed"' body.json || { echo "::error::응답에 changed 칸이 없습니다"; exit 1; }
